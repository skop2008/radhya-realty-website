<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f3d"/>
      <stop offset="50%" stop-color="#0a1730"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d7"/>
      <stop offset="35%" stop-color="#e3c883"/>
      <stop offset="70%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#9a7728"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c9a24b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a7728" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#navyGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Architectural Pediment / Roof from Radhya Logo -->
  <g filter="url(#goldGlow)">
    <path d="M140 210 L256 116 L372 210" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 4 Architectural Window Grid -->
    <g fill="#e3c883">
      <rect x="238" y="156" width="15" height="15" rx="2.5"/>
      <rect x="259" y="156" width="15" height="15" rx="2.5"/>
      <rect x="238" y="175" width="15" height="15" rx="2.5"/>
      <rect x="259" y="175" width="15" height="15" rx="2.5"/>
    </g>

    <!-- Center Monogram "RR" -->
    <text x="256" y="335" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-weight="700" font-size="124" letter-spacing="2" fill="url(#goldGrad)">RR</text>
    
    <!-- Brand Wordmark -->
    <text x="256" y="405" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="28" letter-spacing="10" fill="#e3c883">RADHYA</text>
  </g>
</svg>